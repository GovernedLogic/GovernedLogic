name: Deploy governedlogic.com

on:
  workflow_run:
    workflows: ["Validate governedlogic.com"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: governedlogic-pages
  cancel-in-progress: false

jobs:
  build:
    # Push to main deploys only after Validate governedlogic.com succeeded for that push.
    # A validation run for a pull request or a failed run does not deploy.
    # workflow_dispatch remains a manual deploy of github.sha and still runs the
    # build and check-restored gate below; it does not rerun the visual suite.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build reviewed public artifact
        run: python3 scripts/build_site.py --output "${{ runner.temp }}/site"
      - name: Verify artifact boundary
        run: |
          python3 scripts/check-restored.py --root "${{ runner.temp }}/site" --artifact
          node --check "${{ runner.temp }}/site/assets/opening.js"
          node --check "${{ runner.temp }}/site/assets/earth-renderer.js"
          node --check "${{ runner.temp }}/site/assets/material-environment.js"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify live routes and publication boundary
        run: python3 scripts/check-restored.py --live https://governedlogic.com --attempts 6 --delay 10

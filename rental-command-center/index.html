<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental Command Center</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#0f172a;color:#f8fafc}header{background:#020617;padding:14px;position:sticky;top:0;border-bottom:1px solid #334155}h1{margin:0 0 6px}.small{color:#cbd5e1;font-size:13px;line-height:1.35}.wrap{padding:12px;max-width:1500px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.card{background:#111827;border:1px solid #334155;border-radius:10px;padding:10px}.num{font-size:24px;font-weight:bold}.label{font-size:12px;color:#cbd5e1}input,select,button,textarea{padding:9px;border-radius:8px;border:1px solid #334155;background:#020617;color:#f8fafc}button{background:#0284c7;border:0;font-weight:bold;cursor:pointer}.gray{background:#334155}.redbtn{background:#991b1b}table{width:100%;border-collapse:collapse;background:#111827}th,td{border:1px solid #334155;padding:7px;vertical-align:top;font-size:13px}th{background:#020617;color:#cbd5e1}.tag{border-radius:999px;padding:3px 7px;font-weight:bold;font-size:12px;white-space:nowrap}.active{background:#14532d}.wait{background:#78350f}.out{background:#7f1d1d}.low{background:#334155}.possible{background:#1e3a8a}a{color:#7dd3fc;word-break:break-word}textarea{width:100%;height:190px;margin-top:10px;font-family:monospace}td[contenteditable=true]:focus{outline:2px solid #38bdf8}.note{background:#111827;border:1px solid #334155;border-radius:10px;padding:10px;margin:10px 0}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header><h1>Rental Command Center</h1><div class="small" id="mission">Loading command center...</div></header>
<div class="wrap">
<div class="cards"><div class="card"><div class="num" id="total">0</div><div class="label">Total</div></div><div class="card"><div class="num" id="activeCount">0</div><div class="label">Active/Possible</div></div><div class="card"><div class="num" id="waitingCount">0</div><div class="label">Waiting</div></div><div class="card"><div class="num" id="outCount">0</div><div class="label">Out</div></div><div class="card"><div class="num" id="highCount">0</div><div class="label">High Priority</div></div></div>
<div class="note small"><b>Hard filters:</b> <span id="filters"></span><br><b>Areas:</b> <span id="areas"></span><br><b>Canonical data:</b> <a target="_blank" href="properties.json">properties.json</a></div>
<div class="bar"><input id="q" placeholder="Search"><select id="filter"><option value="">All</option><option>Active</option><option>Waiting</option><option>Out</option><option>Backup</option></select><select id="priority"><option value="">All priorities</option><option>Highest</option><option>High</option><option>Medium</option><option>Low</option><option>None</option></select><button onclick="addRow()">Add row</button><button onclick="copySummary()">Copy email summary</button><button class="gray" onclick="copyJson()">Copy JSON update</button><button class="gray" onclick="reloadCanonical()">Reload canonical</button></div>
<table><thead><tr><th>Property</th><th>City</th><th>Status</th><th>Priority</th><th>Price</th><th>Available</th><th>Link</th><th>Last action</th><th>Next step</th><th></th></tr></thead><tbody id="body"></tbody></table>
<textarea id="out" readonly placeholder="Email summary or JSON update appears here"></textarea>
</div>
<script>
let commandData={mission:'Secure long-term rental before June 30 at 9 PM.',hardFilters:[],areas:[],properties:[]};let seed=[];let rows=[];
function toRows(props){return (props||[]).map(function(p){return [p.property||'',p.city||'',p.status||'',p.priority||'',p.price||'',p.available||'',p.link||'',p.lastAction||'',p.nextStep||'']})}
function toProps(rs){return rs.map(function(r){return {property:r[0]||'',city:r[1]||'',status:r[2]||'',priority:r[3]||'',price:r[4]||'',available:r[5]||'',link:r[6]||'',lastAction:r[7]||'',nextStep:r[8]||''}})}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function cls(s){s=(s||'').toLowerCase();if(s.indexOf('out')>-1)return'out';if(s.indexOf('wait')>-1||s.indexOf('stall')>-1)return'wait';if(s.indexOf('backup')>-1||s.indexOf('delay')>-1||s.indexOf('low')>-1)return'low';if(s.indexOf('active')>-1||s.indexOf('apply')>-1)return'active';return'possible'}
function save(){localStorage.setItem('rentalRows',JSON.stringify(rows));metrics()}
function paintMeta(){document.getElementById('mission').innerText=(commandData.mission||'Rental command center')+' Updated: '+(commandData.updatedAt||'unknown');document.getElementById('filters').innerText=(commandData.hardFilters||[]).join('; ');document.getElementById('areas').innerText=(commandData.areas||[]).join(', ')}
function render(){let q=document.getElementById('q').value.toLowerCase();let f=document.getElementById('filter').value.toLowerCase();let p=document.getElementById('priority').value.toLowerCase();let b=document.getElementById('body');b.innerHTML='';rows.forEach(function(r,i){let hay=r.join(' ').toLowerCase();let c=cls(r[2]);let pr=(r[3]||'').toLowerCase();if(q&&hay.indexOf(q)<0)return;if(f&&!(f==='active'&&['active','possible'].indexOf(c)>-1||f==='waiting'&&c==='wait'||f==='out'&&c==='out'||f==='backup'&&c==='low'))return;if(p&&pr!==p)return;let tr=document.createElement('tr');tr.innerHTML='<td contenteditable onblur="edit('+i+',0,this.innerText)">'+esc(r[0])+'</td><td contenteditable onblur="edit('+i+',1,this.innerText)">'+esc(r[1])+'</td><td contenteditable onblur="edit('+i+',2,this.innerText)"><span class="tag '+c+'">'+esc(r[2])+'</span></td><td contenteditable onblur="edit('+i+',3,this.innerText)">'+esc(r[3])+'</td><td contenteditable onblur="edit('+i+',4,this.innerText)">'+esc(r[4])+'</td><td contenteditable onblur="edit('+i+',5,this.innerText)">'+esc(r[5])+'</td><td contenteditable onblur="edit('+i+',6,this.innerText)">'+(r[6]?'<a target="_blank" href="'+esc(r[6])+'">Open</a><br>'+esc(r[6]):'')+'</td><td contenteditable onblur="edit('+i+',7,this.innerText)">'+esc(r[7])+'</td><td contenteditable onblur="edit('+i+',8,this.innerText)">'+esc(r[8])+'</td><td><button onclick="copyOne('+i+')">Copy</button><br><button class="redbtn" onclick="del('+i+')">Delete</button></td>';b.appendChild(tr)});metrics()}
function metrics(){document.getElementById('total').innerText=rows.length;document.getElementById('activeCount').innerText=rows.filter(function(r){return ['active','possible'].indexOf(cls(r[2]))>-1}).length;document.getElementById('waitingCount').innerText=rows.filter(function(r){return cls(r[2])==='wait'}).length;document.getElementById('outCount').innerText=rows.filter(function(r){return cls(r[2])==='out'}).length;document.getElementById('highCount').innerText=rows.filter(function(r){return ['highest','high'].indexOf((r[3]||'').toLowerCase())>-1}).length}
function edit(i,j,v){rows[i][j]=v.trim();save();render()}function addRow(){rows.unshift(['New property','','New','High','','','','Identified as potential fit.','Verify date, detached, cat + 40 lb dog, yard/privacy, application terms.']);save();render()}function del(i){if(confirm('Delete row?')){rows.splice(i,1);save();render()}}
function copyOne(i){let r=rows[i];navigator.clipboard.writeText(r[0]+', '+r[1]+'\nStatus: '+r[2]+'\nLast action: '+r[7]+'\nNext step: '+r[8]+'\nLink: '+(r[6]||'N/A'))}
function copySummary(){let t='Rental Command Center Update\n\n| Property | Status | Last Action | Next Step |\n|---|---|---|---|\n';rows.forEach(function(r){t+='| '+r[0]+', '+r[1]+' | '+r[2]+' | '+r[7]+' | '+r[8]+' |\n'});t+='\nCore requirements: detached single-family preferred, private/fenced backyard, one cat + one 40 lb dog, move-in now/July 1 preferred, $3,000-$3,800 target.\n';document.getElementById('out').value=t;navigator.clipboard.writeText(t)}
function copyJson(){let data={updatedAt:new Date().toISOString(),mission:commandData.mission,hardFilters:commandData.hardFilters,areas:commandData.areas,properties:toProps(rows)};let t=JSON.stringify(data,null,2);document.getElementById('out').value=t;navigator.clipboard.writeText(t)}
function reloadCanonical(){if(confirm('Reload canonical GitHub data and discard local browser edits?')){localStorage.removeItem('rentalRows');loadData()}}
async function loadData(){try{let res=await fetch('properties.json?time='+Date.now(),{cache:'no-store'});commandData=await res.json();seed=toRows(commandData.properties);rows=JSON.parse(localStorage.getItem('rentalRows')||JSON.stringify(seed));}catch(e){document.getElementById('mission').innerText='Could not load properties.json';rows=JSON.parse(localStorage.getItem('rentalRows')||'[]')}paintMeta();render()}
document.getElementById('q').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);document.getElementById('priority').addEventListener('change',render);loadData();
</script>
</body>
</html>

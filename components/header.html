<button type="button" class="skip-link">Skip to content</button>
<script>
(function(){
  document.documentElement.classList.add('gl-js');
  var skip=document.querySelector('button.skip-link');
  function mainEl(){return document.querySelector('main');}
  function path(p){try{var u=new URL(p,location.origin);var x=u.pathname;if(x.length>1&&x.endsWith('/'))x=x.slice(0,-1);return x;}catch(e){return '';}}
  function mark(root){if(!root)return;var here=path(location.pathname);root.querySelectorAll('.gl-go>a[href]').forEach(function(link){var raw=link.getAttribute('href')||'';var hashed=false;try{hashed=new URL(raw,location.origin).hash.length>1;}catch(e){}if(hashed){if(link.getAttribute('aria-current')==='page')link.removeAttribute('aria-current');return;}if(path(raw)===here)link.setAttribute('aria-current','page');});}
  function go(){var m=mainEl();if(m&&!m.hasAttribute('tabindex'))m.setAttribute('tabindex','-1');mark(document.querySelector('header.site-bar'));mark(document.querySelector('footer.site-footer'));}
  if(skip)skip.addEventListener('click',function(){var m=mainEl();if(!m)return;if(!m.hasAttribute('tabindex'))m.setAttribute('tabindex','-1');m.focus();});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
<header class="site-bar" id="gl-home-bar">
  <form class="gl-go gl-home-brand" method="get" action="/"><button type="submit" class="site-brand"><img src="/assets/brand/gl-logo.webp" alt="" width="256" height="256"><span class="gl-brand-text"><span class="gl-brand-name">GOVERNED LOGIC</span> <small>REASONING SYSTEMS</small></span></button></form>
  <nav aria-label="Primary"><form class="gl-go" method="get" action="/concepts/governed-logic/"><button type="submit">Governed Logic</button></form><form class="gl-go" method="get" action="/concepts/ultimate-grounding/"><button type="submit">Ultimate Grounding</button></form><form class="gl-go" method="get" action="/concepts/governed-intelligence/"><button type="submit">Governed Intelligence</button></form><form class="gl-go" method="get" action="/company/"><button type="submit">Organization</button></form><form class="gl-go" method="get" action="/research/"><button type="submit">Research</button></form></nav>
</header>

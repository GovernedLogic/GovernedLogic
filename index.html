<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Governed Logic Reasoning Systems</title>
<meta name="description" content="Governed Logic Reasoning Systems.">
<meta name="author" content="Paul André Couchoud">
<meta name="theme-color" content="#000000">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://governedlogic.com/">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 45%,rgba(0,255,65,.045),transparent 24%),
radial-gradient(circle at 50% 50%,transparent 0 42%,rgba(0,0,0,.28) 72%,rgba(0,0,0,.78) 100%)}
.lockup{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3vw,30px);width:min(78vw,760px);opacity:0;transform:translateY(8px);animation:arrive 1.6s ease .35s forwards}
.mark{display:block;width:clamp(92px,15vw,156px);height:auto;filter:drop-shadow(0 0 26px rgba(0,255,65,.13)) drop-shadow(0 0 34px rgba(22,140,250,.10))}
.wordmark{display:block;width:min(100%,640px);height:auto;filter:drop-shadow(0 0 22px rgba(255,255,255,.035))}
@keyframes arrive{to{opacity:1;transform:none}}
@media(max-width:600px){
  .lockup{width:min(84vw,520px);gap:20px}
  .mark{width:112px}
  .wordmark{width:100%}
}
@media(prefers-reduced-motion:reduce){
  .lockup{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<main aria-label="Governed Logic Reasoning Systems">
<canvas id="particles" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div class="lockup">
  <img class="mark" src="/assets/governed-logic-mark.webp" alt="">
  <img class="wordmark" src="/assets/gl-reasoning-systems.webp" alt="Governed Logic Reasoning Systems">
</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,D=1,pts=[];
function resize(){
  D=Math.min(devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;
  canvas.width=W*D;canvas.height=H*D;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(D,0,0,D,0,0);
  const count=reduced?0:(W<700?78:120);
  pts=Array.from({length:count},(_,i)=>({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.055,vy:(Math.random()-.5)*.055,
    r:.45+Math.random()*.75,
    g:i%19===0
  }));
}
addEventListener('resize',resize);resize();
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of pts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.g?'rgba(0,255,65,.34)':'rgba(255,255,255,.28)';
    ctx.fill();
  }
  if(!reduced)requestAnimationFrame(draw);
}
draw();
})();
</script>
</body>
</html>
